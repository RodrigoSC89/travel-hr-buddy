openapi: 3.0.3
info:
  title: Nautilus One API
  description: |
    API de Integração do Sistema Nautilus One para gestão marítima.
    
    ## Autenticação
    A maioria dos endpoints requer autenticação via JWT token no header `Authorization`.
    
    ## APIs Externas Integradas
    - **StormGlass** - Previsão meteorológica marítima
    - **MarineTraffic** - Rastreamento AIS de embarcações
    - **USGS/NOAA** - Dados sísmicos e alertas
    - **AssemblyAI** - Transcrição de áudio
    - **SendGrid** - Envio de emails
    - **Slack** - Notificações em tempo real
    
  version: 3.0.2
  contact:
    name: Nautilus One Support
    email: support@nautilus.one
  license:
    name: Proprietary
    url: https://nautilus.one/license

servers:
  - url: https://vnbptmixvwropvanyhdb.supabase.co/functions/v1
    description: Production Supabase Edge Functions

tags:
  - name: Weather
    description: APIs de clima e meteorologia marítima
  - name: AIS
    description: Rastreamento de embarcações via AIS
  - name: Alerts
    description: Alertas sísmicos e notificações
  - name: AI
    description: Inteligência artificial e predições
  - name: Communication
    description: Emails e notificações

paths:
  /stormglass-forecast:
    post:
      tags:
        - Weather
      summary: Previsão Meteorológica Marítima
      description: Retorna dados de clima marítimo incluindo ondas, vento, temperatura da água e visibilidade.
      operationId: getStormGlassForecast
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - lat
                - lng
              properties:
                lat:
                  type: number
                  format: float
                  description: Latitude
                  example: -23.55
                lng:
                  type: number
                  format: float
                  description: Longitude
                  example: -46.63
      responses:
        '200':
          description: Dados meteorológicos retornados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StormGlassResponse'
        '400':
          description: Parâmetros inválidos
        '500':
          description: Erro interno do servidor

  /marinetraffic-ais:
    post:
      tags:
        - AIS
      summary: Rastreamento AIS de Embarcação
      description: Retorna dados de posição e navegação de uma embarcação via AIS.
      operationId: getMarineTrafficAIS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mmsi:
                  type: string
                  description: Maritime Mobile Service Identity
                  example: "538005989"
                imo:
                  type: string
                  description: IMO number
                  example: "9703291"
      responses:
        '200':
          description: Dados AIS retornados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AISResponse'
        '400':
          description: MMSI ou IMO não fornecido
        '500':
          description: Erro interno do servidor

  /noaa-earthquake:
    post:
      tags:
        - Alerts
      summary: Dados Sísmicos USGS/NOAA
      description: Retorna dados de terremotos recentes do USGS.
      operationId: getEarthquakeData
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [all_hour, all_day, all_week, all_month, significant_month]
                  default: all_day
                  description: Período de dados
                minMagnitude:
                  type: number
                  format: float
                  default: 2.5
                  description: Magnitude mínima para filtrar
      responses:
        '200':
          description: Dados sísmicos retornados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EarthquakeResponse'
        '500':
          description: Erro interno do servidor

  /notify-slack:
    post:
      tags:
        - Communication
      summary: Enviar Notificação Slack
      description: Envia uma notificação formatada para o canal Slack configurado.
      operationId: sendSlackNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  description: Mensagem a ser enviada
                  example: "Alerta crítico detectado no sistema"
                title:
                  type: string
                  description: Título da notificação
                  example: "Alerta Nautilus"
                severity:
                  type: string
                  enum: [critical, warning, info, success]
                  default: info
                  description: Severidade da notificação
                details:
                  type: object
                  description: Detalhes adicionais em JSON
      responses:
        '200':
          description: Notificação enviada com sucesso
        '400':
          description: Mensagem não fornecida
        '500':
          description: Erro ao enviar notificação

  /nautilus-predict:
    post:
      tags:
        - AI
      summary: Predições Inteligentes
      description: Gera predições usando IA para manutenção, inventário, rotas ou compliance.
      operationId: getNautilusPredictions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - data
              properties:
                type:
                  type: string
                  enum: [maintenance, inventory, route, compliance]
                  description: Tipo de predição
                data:
                  type: object
                  description: Dados para análise
      responses:
        '200':
          description: Predições geradas com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionResponse'
        '429':
          description: Rate limit excedido
        '500':
          description: Erro interno do servidor

components:
  schemas:
    StormGlassResponse:
      type: object
      properties:
        hours:
          type: array
          items:
            type: object
            properties:
              time:
                type: string
                format: date-time
              waveHeight:
                type: object
                properties:
                  sg:
                    type: number
              windSpeed:
                type: object
                properties:
                  sg:
                    type: number
              waterTemperature:
                type: object
                properties:
                  sg:
                    type: number
              airTemperature:
                type: object
                properties:
                  sg:
                    type: number
        meta:
          type: object
          properties:
            lat:
              type: number
            lng:
              type: number

    AISResponse:
      type: object
      properties:
        vessels:
          type: array
          items:
            type: object
            properties:
              mmsi:
                type: string
              name:
                type: string
              lat:
                type: number
              lng:
                type: number
              speed:
                type: number
              course:
                type: number
        track:
          type: array
          items:
            type: object
            properties:
              lat:
                type: number
              lng:
                type: number
              timestamp:
                type: string
                format: date-time
              speed:
                type: number
              course:
                type: number

    EarthquakeResponse:
      type: object
      properties:
        type:
          type: string
          example: FeatureCollection
        metadata:
          type: object
          properties:
            generated:
              type: integer
            count:
              type: integer
            filtered:
              type: boolean
            minMagnitude:
              type: number
        features:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              properties:
                type: object
                properties:
                  mag:
                    type: number
                  place:
                    type: string
                  time:
                    type: integer
                  title:
                    type: string
              geometry:
                type: object
                properties:
                  type:
                    type: string
                  coordinates:
                    type: array
                    items:
                      type: number

    PredictionResponse:
      type: object
      properties:
        predictions:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              description:
                type: string
              severity:
                type: string
                enum: [low, medium, high, critical]
              probability:
                type: number
              recommendedAction:
                type: string
              deadline:
                type: string
              impact:
                type: string
        summary:
          type: string
        overallRisk:
          type: string
          enum: [low, medium, high, critical]

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: apikey

security:
  - bearerAuth: []
  - apiKeyAuth: []
