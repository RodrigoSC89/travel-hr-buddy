name: Quality Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20.x'

jobs:
  quality-gates:
    name: 🛡️ Quality Gates
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📚 Install Dependencies
        run: npm ci

      - name: 🔍 TypeScript Check
        run: npx tsc --noEmit

      - name: 🎨 Lint Check
        run: npm run lint

      - name: 🚫 Gate A - No Console
        run: node scripts/gates/gate-console.cjs
        continue-on-error: false

      - name: 🚫 Gate B - No Mocks
        run: node scripts/gates/gate-mocks.cjs
        continue-on-error: false

      - name: 🚫 Gate C - No Fake API
        run: node scripts/gates/gate-fake-api.cjs
        continue-on-error: false

      - name: ⚠️ Gate D - No TS Ignore
        run: node scripts/gates/gate-ts-ignore.cjs
        continue-on-error: true

      - name: ⚠️ Gate E - Limit Any
        run: node scripts/gates/gate-any.cjs
        continue-on-error: true

      - name: 📊 Gate F - Route Orphans
        run: node scripts/gates/gate-routes.cjs
        continue-on-error: true

      - name: 🏗️ Build Check
        run: npm run build

  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    needs: quality-gates
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📚 Install Dependencies
        run: npm ci

      - name: 🧪 Run Unit Tests
        run: npm run test -- --run
        continue-on-error: true

  e2e-smoke:
    name: 🔥 E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: quality-gates
    if: github.event_name == 'pull_request'
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📚 Install Dependencies
        run: npm ci

      - name: 🎭 Install Playwright
        run: npx playwright install --with-deps chromium

      - name: 🏗️ Build
        run: npm run build

      - name: 🔥 E2E Smoke Tests
        run: npx playwright test --grep "@smoke" --project=chromium
        continue-on-error: true
        env:
          CI: true

  report:
    name: 📋 Generate Report
    runs-on: ubuntu-latest
    needs: [quality-gates, test]
    if: always()
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📚 Install Dependencies
        run: npm ci

      - name: 📊 Generate Gate Report
        run: |
          echo "# Quality Gates Report" > gate-report.md
          echo "Generated: $(date)" >> gate-report.md
          echo "" >> gate-report.md
          node scripts/gates/gate-all.cjs --ci 2>&1 | tee -a gate-report.md || true

      - name: 📤 Upload Report
        uses: actions/upload-artifact@v7
        with:
          name: quality-gates-report
          path: gate-report.md
          retention-days: 7
