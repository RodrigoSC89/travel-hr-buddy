name: Quality Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: 🔍 Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📥 Install dependencies
        run: npm ci

      # TypeScript Check
      - name: 📘 TypeScript Strict Check
        run: npx tsc --noEmit

      # ESLint
      - name: 🔍 Lint Check
        run: npm run lint

      # Unit Tests
      - name: 🧪 Run Tests
        run: npm run test -- --reporter=verbose

      # Build Check
      - name: 🏗️ Build
        run: npm run build

      # Bundle Size Check
      - name: 📊 Check Bundle Size
        run: |
          total_size=$(du -sk dist/assets/*.js 2>/dev/null | awk '{sum += $1} END {print sum}')
          echo "Total JS bundle size: ${total_size}KB"
          if [ "$total_size" -gt 500 ]; then
            echo "⚠️ Warning: Bundle size ${total_size}KB exceeds 500KB"
          else
            echo "✅ Bundle size ${total_size}KB is within limits"
          fi

  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🔒 Security Audit
        run: npm audit --production --audit-level=high
        continue-on-error: true

      - name: 🔍 Check for Secrets
        run: |
          # Check for potential secrets in code
          if grep -rE "(sk-|pk_live|AKIA|api_key\s*=\s*['\"][^'\"]+['\"])" --include="*.ts" --include="*.tsx" src/; then
            echo "⚠️ Potential secrets found in code!"
            exit 1
          else
            echo "✅ No secrets found in code"
          fi
        continue-on-error: true

  report:
    name: 📊 Quality Report
    runs-on: ubuntu-latest
    needs: [quality-check, security-audit]
    if: always()

    steps:
      - name: 📊 Generate Report
        run: |
          echo "## 📊 Quality Gates Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript | ${{ needs.quality-check.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ESLint | ${{ needs.quality-check.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.quality-check.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.quality-check.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security-audit.result == 'success' && '✅ Pass' || '⚠️ Warning' }} |" >> $GITHUB_STEP_SUMMARY
