name: Nautilus CI - Core Modules

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Supabase Types
        run: |
          npx supabase gen types typescript --project-id vnbptmixvwropvanyhdb > src/types/supabase.ts

      - name: Lint and Type Check
        run: |
          npm run lint
          npm run type-check

      - name: Run Playwright Tests
        run: |
          npx playwright install
          npm run test:e2e

      - name: Generate Code Coverage
        run: |
          npm install --no-save nyc
          npx nyc npm run test:e2e

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: playwright-report/

      - name: Notify on Failure (Slack)
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          author_name: Nautilus CI
          fields: repo,message,commit,author
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

      - name: Notify on Failure (Discord)
        if: failure()
        uses: Ilshidur/action-discord@master
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          message: "❌ CI falhou no repositório Nautilus One - verifique os testes e build."

      - name: Send Email Notification on Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[Nautilus CI] Falha no Build"
          to: devops@nautilus.com
          from: Nautilus CI <ci@nautilus.com>
          body: |
            O build do CI falhou. Verifique os logs no GitHub Actions.
            Repositório: Nautilus One
            Branch: ${{ github.ref }}
