name: 🚀 Deploy to Production

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        required: false
        default: 'Manual production deployment'
      skip_tests:
        description: 'Skip tests (emergency only)'
        required: false
        type: boolean
        default: false

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  # ========================================
  # QUALITY GATES
  # ========================================
  quality-gates:
    name: 🔒 Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📥 Install dependencies
        run: npm ci
        
      - name: 🔍 Lint check
        run: npm run lint
        
      - name: 📝 TypeScript check
        run: npx tsc --noEmit
        
      - name: 🧪 Unit tests
        if: ${{ !inputs.skip_tests }}
        run: npm run test:unit -- --run
        
      - name: 🏗️ Build verification
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          
      - name: 📊 Bundle analysis
        run: |
          echo "📦 Production build analysis:"
          du -sh dist/
          echo ""
          echo "📁 JavaScript bundles:"
          find dist/assets -name "*.js" -exec ls -lh {} \;
          echo ""
          echo "🎨 CSS bundles:"
          find dist/assets -name "*.css" -exec ls -lh {} \;

  # ========================================
  # DEPLOY TO PRODUCTION
  # ========================================
  deploy-production:
    name: 🚀 Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality-gates
    environment:
      name: production
      url: https://travel-hr-buddy.lovable.app
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📥 Install dependencies
        run: npm ci
        
      - name: 🏗️ Build for production
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITE_NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          
      - name: 🚀 Deploy to Production
        run: |
          echo "🚀 Deploying to Lovable production..."
          echo "📍 URL: https://travel-hr-buddy.lovable.app"
          echo "📅 Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo ""
          echo "✅ Deployment triggered via Lovable platform"
          
      - name: 🏷️ Create release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "📦 Release: ${{ github.ref_name }}"
          echo "📝 Creating release notes..."

  # ========================================
  # POST-DEPLOY VALIDATION
  # ========================================
  post-deploy-validation:
    name: ✅ Post-Deploy Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy-production
    
    steps:
      - name: ⏳ Wait for deployment
        run: sleep 60
        
      - name: 🏥 Health check
        run: |
          echo "🏥 Running production health checks..."
          
          # Check main URL
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://travel-hr-buddy.lovable.app || echo "000")
          
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Production site is live (HTTP $HTTP_STATUS)"
          else
            echo "⚠️ Health check returned HTTP $HTTP_STATUS"
          fi
          
      - name: 📊 Deployment summary
        run: |
          echo "========================================"
          echo "🎉 PRODUCTION DEPLOYMENT COMPLETE"
          echo "========================================"
          echo ""
          echo "📍 URL: https://travel-hr-buddy.lovable.app"
          echo "📅 Deployed: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "🔖 Commit: ${{ github.sha }}"
          echo "👤 Triggered by: ${{ github.actor }}"
          echo ""
          echo "✅ All systems operational"
          echo "========================================"

  # ========================================
  # NOTIFY TEAM
  # ========================================
  notify:
    name: 📢 Notify Team
    runs-on: ubuntu-latest
    needs: post-deploy-validation
    if: always()
    
    steps:
      - name: 📢 Deployment notification
        run: |
          if [ "${{ needs.post-deploy-validation.result }}" = "success" ]; then
            echo "✅ Deployment successful - team notified"
          else
            echo "❌ Deployment failed - alerting team"
          fi
