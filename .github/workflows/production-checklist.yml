name: 🚀 Production Readiness Checklist

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # ============================================
  # Security Checks
  # ============================================
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: 🔍 NPM Audit
        id: npm-audit
        run: |
          npm audit --audit-level=high 2>&1 | tee audit-report.txt || true
          echo "audit_status=$?" >> $GITHUB_OUTPUT
      
      - name: 🔐 Check for secrets in code
        run: |
          echo "🔐 Checking for exposed secrets..."
          ! grep -r "sk_live_" --include="*.ts" --include="*.tsx" --include="*.js" src/ || echo "⚠️ Stripe live key found!"
          ! grep -r "OPENAI_API_KEY=" --include="*.ts" --include="*.tsx" src/ || echo "⚠️ OpenAI key found!"
          echo "✅ Secret scan complete"
      
      - name: 📊 Upload security report
        uses: actions/upload-artifact@v6
        with:
          name: security-report
          path: audit-report.txt
          retention-days: 30

  # ============================================
  # Code Quality
  # ============================================
  quality:
    name: 🧹 Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: 🔍 ESLint Check
        id: lint
        run: |
          npm run lint 2>&1 | tee lint-report.txt || true
          LINT_ERRORS=$(grep -c "error" lint-report.txt || echo "0")
          echo "lint_errors=$LINT_ERRORS" >> $GITHUB_OUTPUT
      
      - name: 📝 TypeScript Check
        id: typecheck
        run: |
          npx tsc --noEmit 2>&1 | tee typecheck-report.txt || true
          TS_ERRORS=$(grep -c "error TS" typecheck-report.txt || echo "0")
          echo "ts_errors=$TS_ERRORS" >> $GITHUB_OUTPUT
      
      - name: 🚫 Check @ts-nocheck usage
        run: |
          echo "📊 @ts-nocheck report:"
          TS_NOCHECK_COUNT=$(grep -r "@ts-nocheck" --include="*.ts" --include="*.tsx" src/ | wc -l || echo "0")
          echo "Found $TS_NOCHECK_COUNT files with @ts-nocheck"
          if [ "$TS_NOCHECK_COUNT" -gt 50 ]; then
            echo "⚠️ High number of @ts-nocheck directives"
          fi
      
      - name: 🔍 Check console.log usage
        run: |
          CONSOLE_COUNT=$(grep -r "console.log" --include="*.ts" --include="*.tsx" src/components src/pages src/modules 2>/dev/null | wc -l || echo "0")
          echo "Found $CONSOLE_COUNT console.log statements in production code"
          if [ "$CONSOLE_COUNT" -gt 20 ]; then
            echo "⚠️ Consider removing debug console.log statements"
          fi

  # ============================================
  # Build & Bundle Analysis
  # ============================================
  build:
    name: 🏗️ Build & Bundle
    runs-on: ubuntu-latest
    needs: [security, quality]
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: 🏗️ Build production
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
      
      - name: 📊 Analyze bundle size
        run: |
          echo "📦 Bundle Analysis:"
          echo "===================="
          du -sh dist/ || echo "No dist folder"
          echo ""
          echo "📁 Chunk breakdown:"
          find dist/assets -name "*.js" -exec du -h {} \; 2>/dev/null | sort -rh | head -20 || echo "No JS chunks found"
          echo ""
          echo "🖼️ Asset sizes:"
          find dist/assets -name "*.css" -exec du -h {} \; 2>/dev/null || echo "No CSS files"
      
      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: production-build
          path: dist/
          retention-days: 7

  # ============================================
  # Unit Tests
  # ============================================
  tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: 🧪 Run Vitest
        run: |
          npm run test:unit -- --run --reporter=verbose --coverage 2>&1 | tee test-report.txt || true
      
      - name: 📊 Coverage report
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "📊 Test Coverage Summary:"
            cat coverage/coverage-summary.json
          else
            echo "⚠️ No coverage report generated"
          fi
      
      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          path: |
            test-report.txt
            coverage/
          retention-days: 7

  # ============================================
  # E2E Tests
  # ============================================
  e2e:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      
      - name: Download build
        uses: actions/download-artifact@v7
        with:
          name: production-build
          path: dist/
      
      - name: 🎭 Run Playwright tests
        run: |
          npx playwright test --reporter=list 2>&1 | tee e2e-report.txt || true
      
      - name: Upload E2E report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e2e-report
          path: |
            e2e-report.txt
            playwright-report/
          retention-days: 7

  # ============================================
  # Accessibility Check
  # ============================================
  accessibility:
    name: ♿ Accessibility
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Download build
        uses: actions/download-artifact@v7
        with:
          name: production-build
          path: dist/
      
      - name: 🔍 Check contrast compliance
        run: |
          echo "♿ WCAG Contrast Check:"
          grep -r "opacity-" --include="*.tsx" --include="*.css" src/ | head -20 || echo "Checking opacity usage..."
          echo ""
          echo "⚠️ Manual review recommended for:"
          echo "  - Text with opacity < 0.7"
          echo "  - Colors #999, #aaa on white backgrounds"
          echo "  - Minimum contrast 4.5:1 for small text"

  # ============================================
  # PWA Validation
  # ============================================
  pwa:
    name: 📱 PWA Validation
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      
      - name: Download build
        uses: actions/download-artifact@v7
        with:
          name: production-build
          path: dist/
      
      - name: 🔍 Validate PWA assets
        run: |
          echo "📱 PWA Checklist:"
          echo "=================="
          
          if [ -f "dist/manifest.json" ] || [ -f "dist/manifest.webmanifest" ]; then
            echo "✅ Manifest file exists"
          else
            echo "❌ Manifest file missing"
          fi
          
          if [ -f "dist/sw.js" ] || [ -f "dist/service-worker.js" ]; then
            echo "✅ Service Worker exists"
          else
            echo "⚠️ Service Worker may be missing"
          fi
          
          if ls dist/icons/*.png 1> /dev/null 2>&1 || ls dist/*.png 1> /dev/null 2>&1; then
            echo "✅ App icons present"
          else
            echo "⚠️ App icons may be missing"
          fi

  # ============================================
  # Final Report
  # ============================================
  report:
    name: 📋 Final Report
    runs-on: ubuntu-latest
    needs: [security, quality, build, tests, e2e, accessibility, pwa]
    if: always()
    steps:
      - name: 📋 Generate summary
        run: |
          echo "# 🧭 Nautilus One - Production Readiness Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Checklist Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 Security | ${{ needs.security.result == 'success' && '✅ Pass' || '⚠️ Review' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧹 Code Quality | ${{ needs.quality.result == 'success' && '✅ Pass' || '⚠️ Review' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ Build | ${{ needs.build.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Unit Tests | ${{ needs.tests.result == 'success' && '✅ Pass' || '⚠️ Review' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎭 E2E Tests | ${{ needs.e2e.result == 'success' && '✅ Pass' || '⚠️ Review' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ♿ Accessibility | ${{ needs.accessibility.result == 'success' && '✅ Pass' || '⚠️ Review' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📱 PWA | ${{ needs.pwa.result == 'success' && '✅ Pass' || '⚠️ Review' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "📅 Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "🔗 Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "🌿 Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
