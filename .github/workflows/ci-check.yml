name: Nautilus CI - Critical Modules

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-critical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run typecheck

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Deps
        run: npm ci

      - name: Build Project
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e-critical-modules:
    name: 🎭 E2E Tests - Critical Modules
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Deps
        run: npm ci

      - name: Download Build Artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run Risk Management Tests
        run: npx playwright test tests/e2e/critical-modules/risk.spec.ts --project=chromium
        continue-on-error: true

      - name: Run SGSO Audit Tests
        run: npx playwright test tests/e2e/critical-modules/auditoria.spec.ts --project=chromium
        continue-on-error: true

      - name: Run Incident Management Tests
        run: npx playwright test tests/e2e/critical-modules/incidentes.spec.ts --project=chromium
        continue-on-error: true

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-critical
          path: playwright-report/
          retention-days: 14

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-critical
          path: test-results.json
          retention-days: 14
