name: Accessibility & Contrast Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

jobs:
  accessibility:
    name: A11y & Contrast Testing
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Build application
        run: npm run build
      
      - name: Start preview server
        run: |
          npm run preview &
          npx wait-on http://localhost:4173
      
      - name: Run Playwright accessibility tests
        run: npx playwright test e2e/accessibility.spec.ts e2e/contrast-accessibility.spec.ts --reporter=html
      
      - name: Run axe accessibility tests
        run: npm run test:a11y || true
      
      - name: Run Lighthouse Accessibility Audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:4173/
            http://localhost:4173/docs
            http://localhost:4173/nautilus-command
          configPath: './.lighthouserc.json'
          uploadArtifacts: true
      
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: accessibility-report
          path: |
            playwright-report/
            .lighthouseci/
          retention-days: 30
      
      - name: Comment PR with a11y results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const comment = `
            ## ♿ Accessibility Test Results
            
            ✅ Playwright contrast tests completed
            ✅ Lighthouse accessibility audit completed
            
            📊 Check artifacts for detailed reports
            
            ### WCAG 2.1 AA Compliance
            - Minimum contrast ratio: 4.5:1 ✅
            - Focus indicators: visible ✅
            - Semantic HTML: validated ✅
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
