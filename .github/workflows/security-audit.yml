name: Security Audit

on:
  push:
    branches: [main, develop]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/security-audit.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'package.json'
      - 'package-lock.json'
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (high severity)
        id: npm_audit
        continue-on-error: true
        run: |
          npm audit --audit-level=high --json > npm-audit-results.json 2>&1 || true
          cat npm-audit-results.json

  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: Run Snyk vulnerability test
        id: snyk_test
        continue-on-error: true
        run: |
          snyk test --severity-threshold=high --json > snyk-results.json 2>&1 || true
          
      - name: Run Snyk code analysis
        continue-on-error: true
        run: |
          snyk code test --json > snyk-code-results.json 2>&1 || true

      - name: Parse Snyk results
        id: parse_snyk
        run: |
          if [ -f snyk-results.json ]; then
            VULNS=$(cat snyk-results.json | jq '.vulnerabilities | length // 0' 2>/dev/null || echo "0")
            HIGH=$(cat snyk-results.json | jq '[.vulnerabilities[] | select(.severity == "high")] | length // 0' 2>/dev/null || echo "0")
            CRITICAL=$(cat snyk-results.json | jq '[.vulnerabilities[] | select(.severity == "critical")] | length // 0' 2>/dev/null || echo "0")
            
            echo "total=$VULNS" >> $GITHUB_OUTPUT
            echo "high=$HIGH" >> $GITHUB_OUTPUT
            echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          else
            echo "total=0" >> $GITHUB_OUTPUT
            echo "high=0" >> $GITHUB_OUTPUT
            echo "critical=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload Snyk results
        uses: actions/upload-artifact@v7
        with:
          name: snyk-results
          path: |
            snyk-results.json
            snyk-code-results.json
          retention-days: 30

      - name: Comment on PR with Snyk results
        if: github.event_name == 'pull_request' && steps.parse_snyk.outputs.total > 0
        uses: actions/github-script@v8
        with:
          script: |
            const total = '${{ steps.parse_snyk.outputs.total }}';
            const high = '${{ steps.parse_snyk.outputs.high }}';
            const critical = '${{ steps.parse_snyk.outputs.critical }}';
            
            const body = `## 🔍 Snyk Security Scan Results
            
            | Severity | Count |
            |----------|-------|
            | 🔴 Critical | ${critical} |
            | 🟠 High | ${high} |
            | 📊 Total | ${total} |
            
            Review the uploaded artifacts for detailed vulnerability information.
            
            Run \`npx snyk test\` locally for details.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Parse audit results
        id: parse_audit
        run: |
          if [ -f npm-audit-results.json ]; then
            VULNERABILITIES=$(cat npm-audit-results.json | jq '.metadata.vulnerabilities // {}')
            HIGH=$(echo $VULNERABILITIES | jq '.high // 0')
            CRITICAL=$(echo $VULNERABILITIES | jq '.critical // 0')
            
            echo "high=$HIGH" >> $GITHUB_OUTPUT
            echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
            
            if [ "$HIGH" -gt 0 ] || [ "$CRITICAL" -gt 0 ]; then
              echo "has_vulnerabilities=true" >> $GITHUB_OUTPUT
            else
              echo "has_vulnerabilities=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "high=0" >> $GITHUB_OUTPUT
            echo "critical=0" >> $GITHUB_OUTPUT
            echo "has_vulnerabilities=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload audit results
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-results
          path: npm-audit-results.json
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.parse_audit.outputs.has_vulnerabilities == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const high = '${{ steps.parse_audit.outputs.high }}';
            const critical = '${{ steps.parse_audit.outputs.critical }}';
            
            const body = `## 🔐 Security Audit Results
            
            | Severity | Count |
            |----------|-------|
            | 🔴 Critical | ${critical} |
            | 🟠 High | ${high} |
            
            Please review and fix these vulnerabilities before merging.
            
            Run \`npm audit\` locally for details.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail on critical vulnerabilities
        if: steps.parse_audit.outputs.critical > 0
        run: |
          echo "❌ Critical vulnerabilities found: ${{ steps.parse_audit.outputs.critical }}"
          exit 1

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
          comment-summary-in-pr: always

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check licenses
        run: |
          npx license-checker --summary --production > license-summary.txt
          cat license-summary.txt
          
          # Check for problematic licenses
          if grep -E "(GPL-3.0|AGPL|SSPL)" license-summary.txt; then
            echo "⚠️ Warning: Potentially problematic licenses found"
          fi

      - name: Upload license report
        uses: actions/upload-artifact@v7
        with:
          name: license-report
          path: license-summary.txt
          retention-days: 30

  outdated-check:
    name: Check Outdated Dependencies
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check outdated packages
        run: |
          npm outdated --json > outdated.json || true
          
          # Count outdated packages
          OUTDATED_COUNT=$(cat outdated.json | jq 'length')
          echo "Found $OUTDATED_COUNT outdated packages"
          
          # Show major updates
          echo "### Major updates available:"
          cat outdated.json | jq -r 'to_entries | .[] | select(.value.current != .value.latest) | "\(.key): \(.value.current) → \(.value.latest)"' || echo "None"

      - name: Upload outdated report
        uses: actions/upload-artifact@v7
        with:
          name: outdated-report
          path: outdated.json
          retention-days: 7

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [npm-audit, snyk-scan, license-check, outdated-check]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "## 🛡️ Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.npm-audit.result }}" == "success" ]; then
            echo "| NPM Audit | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| NPM Audit | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.snyk-scan.result }}" == "success" ]; then
            echo "| Snyk Scan | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Snyk Scan | ⚠️ Check results |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.license-check.result }}" == "success" ]; then
            echo "| License Check | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| License Check | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.outdated-check.result }}" == "success" ]; then
            echo "| Outdated Check | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Outdated Check | ⚠️ Check logs |" >> $GITHUB_STEP_SUMMARY
          fi
