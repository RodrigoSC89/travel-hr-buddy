<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nauti One" />
    <link rel="apple-touch-icon" href="/icons/nauti-one-logo.png" />
    
    <!-- Security Meta Tags -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    
    <!-- Font Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous">
    
    <!-- Asset Preload -->
    <link rel="preload" as="image" href="/icons/nauti-one-logo.png" type="image/png" />
    
    <title>Nauti One - Sistema de Gestão Marítima</title>
    <meta name="description" content="Nauti One - Sistema revolucionário de gestão marítima com IA integrada. Tripulação, Documentos, Compliance, Operações e muito mais." />
    <meta name="author" content="Nauti One" />
    <meta name="keywords" content="gestão marítima, tripulação, compliance, PEOTRAM, PEO-DP, MLC 2006, STCW, navios, embarcações" />

    <meta property="og:title" content="Nauti One - Sistema de Gestão Marítima" />
    <meta property="og:description" content="Sistema revolucionário de gestão marítima com IA integrada. Tripulação, Documentos, Compliance, Operações." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/nauti-one-logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@nautione" />
    <meta name="twitter:image" content="/icons/nauti-one-logo.png" />
  </head>

  <body>
    <!-- Initial loader - removed by React on mount -->
    <div id="initial-loader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;z-index:9999;">
      <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" style="animation:spin 1s linear infinite;">
        <circle cx="12" cy="12" r="10" stroke-opacity="0.25"/>
        <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/>
      </svg>
      <p style="color:#94a3b8;margin-top:16px;font-family:system-ui,sans-serif;">Carregando...</p>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Fallback: remove loader after 10s if React fails to mount -->
    <script>
      setTimeout(function() {
        var loader = document.getElementById('initial-loader');
        if (loader) loader.remove();
      }, 10000);
    </script>
  </body>
</html>
