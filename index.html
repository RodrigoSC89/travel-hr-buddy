      .gap-2{gap:0.5rem}

        .bg-background{background-color:#fff}
        .text-foreground{color:#0a0e1a}
        .text-muted{color:#64748b}
      }
      @media(prefers-reduced-motion:reduce){*{animation-duration:0.01ms!important;transition-duration:0.01ms!important}}

  <body>
    <!-- PATCH v61: Force fresh deploy with anti-cache -->
    <div id="root">
      <div id="initial-loader" class="min-h-screen flex items-center justify-center bg-background">
        <div class="text-center space-y-4 p-6 max-w-sm">
          <div class="animate-spin h-12 w-12 border-4 border-primary border-t-transparent rounded-full" style="margin:0 auto"></div>
          <p id="boot-status" class="text-muted text-sm">v61: Iniciando...</p>
        </div>
      </div>
    </div>
    
    <!-- PATCH v61: Robust boot sequence with error detection -->
    <script>
      (function() {
        'use strict';
        window.__NAUTI_APP_LOADED__ = false;
        window.__BOOT_VERSION__ = 'v61';
        var status = document.getElementById('boot-status');
        var startTime = Date.now();
        
        // Progress tracking
        window.__updateBootStatus = function(msg) {
          var elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
          if (status) status.textContent = 'v61: ' + msg + ' (' + elapsed + 's)';
          console.log('[Boot v61] ' + msg + ' @ ' + elapsed + 's');
        };
        
        // Show recovery after 20s if bundle completely failed
        setTimeout(function() {
          if (!window.__NAUTI_APP_LOADED__) {
            console.error('[Boot v61] Bundle failed to mount after 20s');
            var loader = document.getElementById('initial-loader');
            if (loader) {
              loader.innerHTML = '<div class="text-center space-y-4 p-6 max-w-sm">' +
                '<p class="text-foreground text-lg font-semibold">Carregamento lento</p>' +
                '<p class="text-muted text-sm">O aplicativo demorou para carregar. Limpe o cache para atualizar.</p>' +
                '<button onclick="window.clearCacheAndReload()" class="btn">Limpar cache e recarregar</button>' +
                '</div>';
            }
          }
        }, 20000);
        
        // Manual cache clear utility
        window.clearCacheAndReload = function() {
          console.log('[Boot v61] Clearing all caches...');
          try { localStorage.clear(); sessionStorage.clear(); } catch(e) {}
          if ('caches' in window) {
            caches.keys().then(function(k) { 
              k.forEach(function(c) { caches.delete(c); }); 
            });
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(r) { 
              r.forEach(function(s) { s.unregister(); }); 
            });
          }
          setTimeout(function() { 
            location.replace(location.origin + '/auth?nocache=' + Date.now()); 
          }, 300);
        };
        
        window.__updateBootStatus('HTML pronto');
      })();
    </script>
    
    <!-- Main Application Bundle - Vite transforms this during build -->
    <script type="module" src="/src/main.tsx"></script>
