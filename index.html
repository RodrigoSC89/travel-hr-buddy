<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- CRITICAL: Inline Critical CSS for FCP -->
    <style id="critical-css">
      *,*::before,*::after{box-sizing:border-box}
      html{-webkit-text-size-adjust:100%;line-height:1.5;scroll-behavior:smooth}
      body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
      #root{min-height:100vh;display:flex;flex-direction:column}
      .loader-container{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a}
      .loader-content{text-align:center;padding:24px}
      .spinner{height:48px;width:48px;border:4px solid #0ea5e9;border-top-color:transparent;border-radius:50%;margin:0 auto 16px;animation:spin 1s linear infinite}
      .loader-text{color:#94a3b8;font-size:14px}
      @keyframes spin{to{transform:rotate(360deg)}}
      @media(prefers-color-scheme:light){.loader-container{background:#fff}}
    </style>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nauti One" />
    <link rel="apple-touch-icon" href="/icons/nauti-one-logo.png" />
    
    <!-- Security Meta Tags -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    
    <!-- DNS Prefetch for external resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://vnbptmixvwropvanyhdb.supabase.co" />
    
    <!-- Preconnect to critical origins -->
    <link rel="preconnect" href="https://vnbptmixvwropvanyhdb.supabase.co" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    
    <!-- Async Font Loading -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" /></noscript>
    
    <title>Nauti One - Sistema de Gestão Marítima</title>
    <meta name="description" content="Nauti One - Sistema revolucionário de gestão marítima com IA integrada. Tripulação, Documentos, Compliance, Operações e muito mais." />
    <meta name="author" content="Nauti One" />
    <meta name="keywords" content="gestão marítima, tripulação, compliance, PEOTRAM, PEO-DP, MLC 2006, STCW, navios, embarcações" />

    <meta property="og:title" content="Nauti One - Sistema de Gestão Marítima" />
    <meta property="og:description" content="Sistema revolucionário de gestão marítima com IA integrada. Tripulação, Documentos, Compliance, Operações." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/nauti-one-logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@nautione" />
    <meta name="twitter:image" content="/icons/nauti-one-logo.png" />
  </head>

  <body>
    <!-- PATCH v63: Ultra simple loader - JS removes it immediately -->
    <div id="root">
      <div id="initial-loader" class="loader-container">
        <div class="loader-content">
          <div class="spinner"></div>
          <p class="loader-text">Carregando...</p>
        </div>
      </div>
    </div>
    
    <!-- PATCH v63: Minimal fallback - only if JS completely fails to load -->
    <script>
      window.__NAUTI_APP_LOADED__ = false;
      
      // Only show error if bundle never loads (60 seconds)
      setTimeout(function() {
        if (!window.__NAUTI_APP_LOADED__ && document.getElementById('initial-loader')) {
          console.error('[Nauti v63] Bundle timeout');
          document.getElementById('initial-loader').innerHTML = 
            '<div style="text-align:center;padding:24px;">' +
            '<p style="color:#f1f5f9;font-size:18px;margin-bottom:16px;">Carregamento falhou</p>' +
            '<button onclick="localStorage.clear();location.reload()" ' +
            'style="background:#0ea5e9;color:white;padding:10px 20px;border-radius:8px;border:none;cursor:pointer;">Recarregar</button></div>';
        }
      }, 60000);
    </script>
    
    <!-- Main Application Bundle -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
