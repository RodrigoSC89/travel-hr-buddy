<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- CRITICAL: Inline Critical CSS for FCP -->
    <style id="critical-css">
      *,*::before,*::after{box-sizing:border-box}
      html{-webkit-text-size-adjust:100%;line-height:1.5;scroll-behavior:smooth}
      body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
      #root{min-height:100vh;display:flex;flex-direction:column}
      .min-h-screen{min-height:100vh}
      .flex{display:flex}
      .items-center{align-items:center}
      .justify-center{justify-content:center}
      .bg-background{background-color:#fff}
      .text-foreground{color:#0a0e1a}
      .animate-spin{animation:spin 1s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      .border-primary{border-color:#0ea5e9}
      .border-t-transparent{border-top-color:transparent}
      .rounded-full{border-radius:9999px}
      .h-12{height:3rem}.w-12{width:3rem}.border-4{border-width:4px}
      /* APEX: GPU acceleration and containment */
      .gpu-layer{transform:translateZ(0);will-change:transform;backface-visibility:hidden}
      .lazy-render{content-visibility:auto;contain-intrinsic-size:0 200px}
      .skeleton-shimmer{background:linear-gradient(90deg,#e5e7eb 0%,#f3f4f6 50%,#e5e7eb 100%);background-size:300% 100%;animation:shimmer 1s linear infinite}
      @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
      @media(prefers-color-scheme:dark){
        .bg-background{background-color:#0f172a}
        .text-foreground{color:#f1f5f9}
        .skeleton-shimmer{background:linear-gradient(90deg,#1e293b 0%,#334155 50%,#1e293b 100%);background-size:300% 100%}
      }
      @media(prefers-reduced-motion:reduce){*{animation-duration:0.01ms!important;transition-duration:0.01ms!important}}
    </style>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nauti One" />
    <link rel="apple-touch-icon" href="/icons/nauti-one-logo.png" />
    
    <!-- Security Meta Tags -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    
    <!-- DNS Prefetch for external resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://vnbptmixvwropvanyhdb.supabase.co" />
    
    <!-- Preconnect to critical origins - Performance boost -->
    <link rel="preconnect" href="https://vnbptmixvwropvanyhdb.supabase.co" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    
    <!-- Async Font Loading - Non-blocking -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" /></noscript>
    
    <!-- Logo Preload - Critical for LCP -->
    <link rel="preload" as="image" href="/icons/nauti-one-logo.png" type="image/png" fetchpriority="high" />
    
    <title>Nauti One - Sistema de Gestão Marítima</title>
    <meta name="description" content="Nauti One - Sistema revolucionário de gestão marítima com IA integrada. Tripulação, Documentos, Compliance, Operações e muito mais." />
    <meta name="author" content="Nauti One" />
    <meta name="keywords" content="gestão marítima, tripulação, compliance, PEOTRAM, PEO-DP, MLC 2006, STCW, navios, embarcações" />

    <meta property="og:title" content="Nauti One - Sistema de Gestão Marítima" />
    <meta property="og:description" content="Sistema revolucionário de gestão marítima com IA integrada. Tripulação, Documentos, Compliance, Operações." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/nauti-one-logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@nautione" />
    <meta name="twitter:image" content="/icons/nauti-one-logo.png" />
  </head>

  <body>
    <!-- Initial Loading State - Prevents blank screen -->
    <div id="root">
      <div class="min-h-screen flex items-center justify-center bg-background">
        <div class="animate-spin h-12 w-12 border-4 border-primary border-t-transparent rounded-full"></div>
      </div>
    </div>
    
    <!-- Main Application Bundle -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
