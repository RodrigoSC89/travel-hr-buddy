<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nauti One" />
    <link rel="apple-touch-icon" href="/icons/nauti-one-logo.png" />
    
    <!-- Security Meta Tags -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Cache Control - Force fresh resources -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- Font Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous">
    
    <!-- Asset Preload -->
    <link rel="preload" as="image" href="/icons/nauti-one-logo.png" type="image/png" />
    
    <title>Nauti One - Sistema de Gestão Marítima</title>
    <meta name="description" content="Nauti One - Sistema revolucionário de gestão marítima com IA integrada. Tripulação, Documentos, Compliance, Operações e muito mais." />
    <meta name="author" content="Nauti One" />
    <meta name="keywords" content="gestão marítima, tripulação, compliance, PEOTRAM, PEO-DP, MLC 2006, STCW, navios, embarcações" />

    <meta property="og:title" content="Nauti One - Sistema de Gestão Marítima" />
    <meta property="og:description" content="Sistema revolucionário de gestão marítima com IA integrada. Tripulação, Documentos, Compliance, Operações." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/nauti-one-logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@nautione" />
    <meta name="twitter:image" content="/icons/nauti-one-logo.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
