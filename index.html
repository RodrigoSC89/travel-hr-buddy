    <!-- CRITICAL: Inline Critical CSS for FCP -->
    <style id="critical-css">
      *,*::before,*::after{box-sizing:border-box}
      html{-webkit-text-size-adjust:100%;line-height:1.5;scroll-behavior:smooth}
      body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
      #root{min-height:100vh;display:flex;flex-direction:column}
      .min-h-screen{min-height:100vh}
      .flex{display:flex}
      .items-center{align-items:center}
      .justify-center{justify-content:center}
      .bg-background{background-color:#0f172a}
      .text-foreground{color:#f1f5f9}
      .text-muted{color:#94a3b8}
      .animate-spin{animation:spin 1s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      .border-primary{border-color:#0ea5e9}
      .border-t-transparent{border-top-color:transparent}
      .rounded-full{border-radius:9999px}
      .h-12{height:3rem}.w-12{width:3rem}.border-4{border-width:4px}
      .text-center{text-align:center}
      .space-y-4>*+*{margin-top:1rem}
      .p-6{padding:1.5rem}
      .max-w-sm{max-width:24rem}
      .text-lg{font-size:1.125rem}
      .text-sm{font-size:0.875rem}
      .font-semibold{font-weight:600}
      .hidden{display:none}
      .btn{display:inline-block;padding:0.5rem 1rem;background:#0ea5e9;color:white;border-radius:0.375rem;text-decoration:none;font-size:0.875rem;border:none;cursor:pointer}
      .btn:hover{background:#0284c7}
      .btn-secondary{background:#334155}
      .btn-secondary:hover{background:#475569}
      .mt-2{margin-top:0.5rem}
      .gap-2{gap:0.5rem}
      .flex-col{flex-direction:column}
      @media(prefers-color-scheme:light){
        .bg-background{background-color:#fff}
        .text-foreground{color:#0a0e1a}
        .text-muted{color:#64748b}
      }
      @media(prefers-reduced-motion:reduce){*{animation-duration:0.01ms!important;transition-duration:0.01ms!important}}
    </style>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />

  <body>
    <!-- PATCH v52: Aggressive app loader with instant recovery -->
    <div id="root">
      <div id="initial-loader" class="min-h-screen flex items-center justify-center bg-background">
        <div class="text-center space-y-4 p-6 max-w-sm">
          <div class="animate-spin h-12 w-12 border-4 border-primary border-t-transparent rounded-full" style="margin:0 auto"></div>
          <p id="loading-text" class="text-muted text-sm">Carregando...</p>
        </div>
      </div>
    </div>
    
    <!-- PATCH v52: Aggressive cache-busting and recovery -->
    <script>
      (function() {
        'use strict';
        
        // Flag set by React when app loads
        window.__NAUTI_APP_LOADED__ = false;
        
        // Version for forced updates
        var APP_VERSION = 'v52';
        var VERSION_KEY = 'nauti_app_version';
        
        // Aggressive cache clear function
        function nukeCache() {
          console.log('[Boot v52] Nuking all caches...');
          
          // 1. Clear ALL localStorage
          try { localStorage.clear(); } catch(e) {}
          
          // 2. Clear sessionStorage
          try { sessionStorage.clear(); } catch(e) {}
          
          // 3. Clear all caches
          if ('caches' in window) {
            caches.keys().then(function(keys) { 
              keys.forEach(function(k) { caches.delete(k); });
            }).catch(function() {});
          }
          
          // 4. Unregister all service workers
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) { 
              regs.forEach(function(r) { r.unregister(); });
            }).catch(function() {});
          }
        }
        
        // Check if version changed - force cache clear
        var storedVersion = null;
        try { storedVersion = localStorage.getItem(VERSION_KEY); } catch(e) {}
        
        if (storedVersion !== APP_VERSION) {
          console.log('[Boot v52] Version mismatch, clearing cache');
          nukeCache();
          try { localStorage.setItem(VERSION_KEY, APP_VERSION); } catch(e) {}
        }
        
        // Clear and reload function for recovery UI
        window.clearCacheAndReload = function() {
          nukeCache();
          // Wait a bit then reload with cache bust
          setTimeout(function() {
            location.replace(location.origin + '?nocache=' + Date.now());
          }, 500);
        };
        
        // Recovery UI - shown after 4 seconds if app hasn't loaded
        setTimeout(function() {
          if (!window.__NAUTI_APP_LOADED__) {
            console.log('[Boot v52] App not loaded after 4s, showing recovery');
            var loader = document.getElementById('initial-loader');
            if (loader) {
              loader.innerHTML = '<div class="text-center space-y-4 p-6 max-w-sm">' +
                '<div class="text-lg font-semibold text-foreground">Carregamento lento</div>' +
                '<p class="text-sm text-muted">O aplicativo está demorando. Limpe o cache para forçar atualização.</p>' +
                '<div class="flex flex-col gap-2">' +
                '<button onclick="clearCacheAndReload()" class="btn">Limpar cache e recarregar</button>' +
                '<button onclick="location.reload(true)" class="btn btn-secondary mt-2">Tentar novamente</button>' +
                '</div></div>';
            }
          }
        }, 4000);
      })();
    </script>
    
    <!-- Main Application Bundle -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
