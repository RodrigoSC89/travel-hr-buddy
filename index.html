    <!-- Critical: Only Inter 400,500,600,700 initially. Others deferred. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" crossorigin="anonymous">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"></noscript>
    
    <!-- Deferred fonts: loaded after paint -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;800;900&family=JetBrains+Mono:wght@400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'" crossorigin="anonymous">

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Nauti One",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "Plataforma de gestão marítima com IA integrada para tripulação, compliance e operações.",

      },
      "creator": {

      }
    }

  </head>

  <body>
    <!-- Initial loader - removed by React on mount. Uses contain:strict for layout isolation (prevents CLS) -->
    <div id="initial-loader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;z-index:9999;">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" style="animation:spin .8s linear infinite;">
        <circle cx="12" cy="12" r="10" stroke-opacity="0.2"/>
        <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/>
      </svg>
      <p style="color:#94a3b8;margin-top:12px;font-family:system-ui,sans-serif;font-size:14px;">Carregando...</p>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}body{overflow-x:hidden;}</style>
    
    <!-- Skip to content link for accessibility -->
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:z-[10000] focus:top-2 focus:left-2 focus:px-4 focus:py-2 focus:bg-primary focus:text-primary-foreground focus:rounded-md focus:text-sm" style="position:absolute;left:-9999px;">
      Pular para o conteúdo principal
    </a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Fallback: if React fails to mount after 12s, show recovery UI -->
    <script>
      setTimeout(function() {
        var loader = document.getElementById('initial-loader');
        if (loader) {
          loader.innerHTML = '<div style="text-align:center;padding:20px;"><p style="color:#f87171;font-size:16px;font-family:system-ui;margin-bottom:12px;">O aplicativo não carregou corretamente.</p><button onclick="(async function(){try{if(\'caches\' in window){var k=await caches.keys();await Promise.all(k.map(function(c){return caches.delete(c)}))}if(\'serviceWorker\' in navigator){var r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(function(s){return s.unregister()}))}localStorage.clear();sessionStorage.clear()}catch(e){}location.href=location.origin+\'/?_sw=\'+Date.now()})()" style="padding:10px 24px;background:#3b82f6;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-family:system-ui;">Limpar cache e recarregar</button></div>';
        }
      }, 12000);
    </script>
  </body>
</html>
